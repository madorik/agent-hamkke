# Push a tag like v0.1.0 (matching apps/desktop/package.json "version") to build and publish a release.
# macOS builds are signed with a Developer ID certificate and notarized; Windows builds are not signed yet.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          version="v$(jq -r .version apps/desktop/package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json ($version)"
            exit 1
          fi
      # Create the draft once so the macOS and Windows jobs upload to the same release.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "Agent Hamkke $GITHUB_REF_NAME" --generate-notes

  # arm64 와 x64 를 따로 동시에 빌드한다(Apple 공증을 기다리는 시간이 겹치게)
  mac:
    needs: draft
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, sign, and notarize
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is missing. See README > Releasing."
              exit 1
            fi
          done
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          pnpm run dist --mac --${{ matrix.arch }} --publish never
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            apps/desktop/release/Agent-Hamkke-mac-${{ matrix.arch }}.dmg \
            apps/desktop/release/Agent-Hamkke-mac-${{ matrix.arch }}.zip

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (unsigned)
        working-directory: apps/desktop
        run: pnpm run dist --win --x64 --publish never
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber apps/desktop/release/Agent-Hamkke-win-x64.exe

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
