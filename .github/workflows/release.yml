# Push a tag like v0.1.0 (matching apps/desktop/package.json "version") to build and publish a release.
# macOS builds are signed with a Developer ID certificate and sent to Apple for notarization; Windows builds are not signed yet.
# The build doesn't wait for Apple: finish-release.yml publishes the draft once Apple has notarized it.
name: Release

on:
  push:
    tags: ['v*']
  # Build a tag that's already pushed again (Actions > Release > Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag must match the app version
        run: |
          version="v$(jq -r .version apps/desktop/package.json)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match apps/desktop/package.json ($version)"
            exit 1
          fi
      # Create the draft once so the macOS and Windows jobs upload to the same release.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "Agent Hamkke $TAG" --generate-notes

  # arm64 와 x64 를 따로 동시에 빌드한다. 한쪽이 실패해도 다른 쪽은 끝까지 간다.
  mac:
    needs: draft
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the signing secrets
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is missing. See README > Releasing."
              exit 1
            fi
          done
      # Apple 키를 넘기지 않으므로 electron-builder 는 공증을 건너뛰고 서명만 한다(공증은 다음 단계).
      - name: Build and sign
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: pnpm run dist --mac --${{ matrix.arch }} --publish never
      # 보내기만 하고 기다리지 않는다. 받은 번호는 초안에 올려 두고 finish-release.yml 이 확인한다.
      - name: Send to Apple for notarization
        working-directory: apps/desktop/release
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          for i in 1 2 3 4 5; do
            out=$(xcrun notarytool submit Agent-Hamkke-mac-${{ matrix.arch }}.dmg \
              --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json) && break
            echo "Sending failed (try $i), trying again"
            sleep $((i * 30))
          done
          id=$(jq -r '.id // empty' <<<"${out:-}")
          if [ -z "$id" ]; then
            echo "::error::Couldn't send the build to Apple for notarization"
            exit 1
          fi
          echo "Apple submission $id"
          echo "$id" > notary-mac-${{ matrix.arch }}.txt
      # 자동 업데이트(electron-updater)는 zip 과 latest-mac.yml 을 쓴다. 아키텍처별 yml 은 update-info 가 하나로 합친다.
      - name: Upload to the draft
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp latest-mac.yml latest-mac-${{ matrix.arch }}.yml
          gh release upload "$TAG" --clobber \
            Agent-Hamkke-mac-${{ matrix.arch }}.dmg \
            Agent-Hamkke-mac-${{ matrix.arch }}.zip \
            Agent-Hamkke-mac-${{ matrix.arch }}.zip.blockmap \
            latest-mac-${{ matrix.arch }}.yml \
            notary-mac-${{ matrix.arch }}.txt

  windows:
    needs: draft
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (unsigned)
        working-directory: apps/desktop
        run: pnpm run dist --win --x64 --publish never
      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/release
          gh release upload "$TAG" --clobber Agent-Hamkke-win-x64.exe Agent-Hamkke-win-x64.exe.blockmap latest.yml

  # 설치한 앱이 새 버전을 찾는 macOS 업데이트 정보: arm64·x64 의 latest-mac.yml 을 하나로 합친다
  update-info:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Merge latest-mac.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --pattern 'latest-mac-*.yml' --clobber
          node "$GITHUB_WORKSPACE/.github/scripts/merge-mac-update.mjs" latest-mac-arm64.yml latest-mac-x64.yml latest-mac.yml
          gh release upload "$TAG" --clobber latest-mac.yml
          gh release delete-asset "$TAG" latest-mac-arm64.yml --yes
          gh release delete-asset "$TAG" latest-mac-x64.yml --yes

  # Apple 이 끝냈으면 바로 공개하고, 아직이면 finish-release.yml 의 30분 주기 확인이 이어받는다.
  finish:
    needs: [update-info]
    uses: ./.github/workflows/finish-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
